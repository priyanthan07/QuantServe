model_name: "yi-1.5-9b"
hf_model_id: "01-ai/Yi-1.5-9B-Chat"

# Quantization
quantization_scheme: "W4A16"
recipe: "GPTQModifier"
calibration_dataset: "wikitext"
calibration_dataset_config: "wikitext-2-raw-v1"
num_calibration_samples: 128
max_seq_length: 4096

# Evaluation benchmarks (must be valid lm_eval task names)
benchmarks:
  - "hellaswag"
  # - "mmlu"
  # - "arc_challenge"
  # - "gsm8k"
  # - "truthfulqa_mc2"

# Soft gate thresholds (accuracy values).
# If a benchmark falls below its threshold, a quality warning is raised.
# The pipeline continues regardless — these are advisory, not blocking.
thresholds:
  hellaswag: 0.72
  # mmlu: 0.58
  # arc_challenge: 0.25
  # truthfulqa_mc2: 0.30
  # gsm8k: 0.60

# vLLM serving arguments
vllm_args: "--max-model-len 4096 --enable-prefix-caching --enable-chunked-prefill"

