model_name: "mistral-7b"
hf_model_id: "mistralai/Mistral-7B-Instruct-v0.3"

# Quantization
quantization_scheme: "W4A16"
recipe: "GPTQModifier"
calibration_dataset: "wikitext"
calibration_dataset_config: "wikitext-2-raw-v1"
num_calibration_samples: 128
max_seq_length: 4096

# Evaluation benchmarks
benchmarks:
  - "hellaswag"
  # - "mmlu"
  # - "arc_challenge"
  # - "gsm8k"
  # - "truthfulqa_mc2"

thresholds:
  hellaswag: 0.70
  # mmlu: 0.58
  # arc_challenge: 0.25
  # truthfulqa_mc2: 0.30
  # gsm8k: 0.60

# vLLM serving arguments
vllm_args: "--max-model-len 4096 --enable-prefix-caching --enable-chunked-prefill"

